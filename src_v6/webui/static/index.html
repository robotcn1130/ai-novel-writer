<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 小说创作系统 v6.0</title>
<style>
:root{
  --bg:#f7f6f3; --panel:#ffffff; --panel-2:#fbfaf8; --line:#e5e2db;
  --line-2:#efece6; --ink:#23211d; --ink-2:#5c584f; --ink-3:#918b7e;
  --accent:#8a5a3c; --accent-soft:#f3ece6; --accent-ink:#6f4429;
  --ok:#3f7a55; --ok-soft:#e9f3ec; --warn:#a8762a; --warn-soft:#fbf2e2;
  --bad:#a3453d; --bad-soft:#fbeceb; --info:#3f6a8a; --info-soft:#e9f1f6;
  --radius:10px; --shadow:0 1px 2px rgba(35,33,29,.05),0 4px 14px rgba(35,33,29,.05);
  --mono:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",
       "Hiragino Sans GB","Source Han Sans SC",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent);text-decoration:none}

/* ---------------- 布局 ---------------- */
#app{display:flex;flex-direction:column;height:100vh}
header{
  display:flex;align-items:center;gap:16px;padding:0 20px;height:54px;
  background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto;
}
.brand{display:flex;align-items:baseline;gap:9px;font-weight:640;letter-spacing:.2px}
.brand .v{font-size:11px;color:var(--ink-3);font-weight:500;
  border:1px solid var(--line);border-radius:20px;padding:1px 8px}
header .spacer{flex:1}
.novpick{display:flex;align-items:center;gap:8px}
.novpick select{
  background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
  padding:6px 10px;min-width:230px;max-width:340px;
}
.tabs{display:flex;gap:2px;padding:0 14px;background:var(--panel);
  border-bottom:1px solid var(--line);flex:0 0 auto}
.tab{
  padding:10px 16px;border:none;background:none;color:var(--ink-2);
  border-bottom:2px solid transparent;margin-bottom:-1px;font-size:14.5px;
  display:flex;align-items:center;gap:7px;
}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--accent-ink);border-bottom-color:var(--accent);font-weight:600}
.tab .dot{width:7px;height:7px;border-radius:50%;background:var(--bad);display:none}
.tab .dot.show{display:block}
main{flex:1;overflow:auto;padding:20px}
.view{display:none}
.view.on{display:block}
.wrap{max-width:1320px;margin:0 auto}

/* ---------------- 通用件 ---------------- */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1080px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;
}
.card>h3{
  margin:0;padding:12px 16px;font-size:13.5px;font-weight:650;letter-spacing:.3px;
  border-bottom:1px solid var(--line-2);background:var(--panel-2);
  display:flex;align-items:center;gap:9px;color:var(--ink-2);
}
.card>h3 .spacer{flex:1}
.card .body{padding:14px 16px}
.card .body.tight{padding:0}
.scroll{max-height:520px;overflow:auto}

.btn{
  border:1px solid var(--line);background:var(--panel);border-radius:8px;
  padding:7px 13px;font-size:13.5px;color:var(--ink-2);transition:.12s;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
}
.btn:hover{background:var(--panel-2);border-color:var(--ink-3);color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-ink);border-color:var(--accent-ink);color:#fff}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-3)}
.btn.ghost:hover{background:var(--accent-soft);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--bad);border-color:#e9d5d3}
.btn.danger:hover{background:var(--bad-soft);border-color:var(--bad)}

input[type=text],input[type=number],input[type=password],select,textarea{
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:7px 10px;width:100%;transition:.12s;
}
input:focus,select:focus,textarea:focus{
  outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);
}
textarea{resize:vertical;line-height:1.7}
label.f{display:block;margin-bottom:10px}
label.f>span{display:block;font-size:12px;color:var(--ink-3);margin-bottom:4px;
  letter-spacing:.2px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}

.tag{
  display:inline-block;padding:1.5px 8px;border-radius:20px;font-size:11.5px;
  background:var(--line-2);color:var(--ink-2);white-space:nowrap;line-height:1.6;
}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.info{background:var(--info-soft);color:var(--info)}
.tag.accent{background:var(--accent-soft);color:var(--accent-ink)}
.mono{font-family:var(--mono);font-size:12.5px}
.dim{color:var(--ink-3)}
.small{font-size:12.5px}
.empty{color:var(--ink-3);padding:22px;text-align:center;font-size:13.5px}
hr.sep{border:none;border-top:1px solid var(--line-2);margin:12px 0}

/* 统计条 */
.stats{display:flex;flex-wrap:wrap;gap:10px}
.stat{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:11px 15px;min-width:118px;box-shadow:var(--shadow);
}
.stat .k{font-size:11.5px;color:var(--ink-3);letter-spacing:.3px}
.stat .v{font-size:21px;font-weight:640;margin-top:1px;line-height:1.3}
.stat .v small{font-size:12px;font-weight:400;color:var(--ink-3)}

/* 列表 */
.list{list-style:none;margin:0;padding:0}
.list li{
  padding:10px 16px;border-bottom:1px solid var(--line-2);
  display:flex;gap:12px;align-items:flex-start;
}
.list li:last-child{border-bottom:none}
.list li:hover{background:var(--panel-2)}
.list .main{flex:1;min-width:0}
.list .title{font-weight:560;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.list .sub{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.list .acts{display:flex;gap:4px;flex:0 0 auto}

/* 世界状态表 */
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{
  text-align:left;font-size:11.5px;font-weight:600;color:var(--ink-3);
  padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel-2);
  letter-spacing:.3px;position:sticky;top:0;z-index:1;
}
table.t td{padding:8px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
table.t tr:last-child td{border-bottom:none}
table.t tr:hover td{background:var(--panel-2)}

/* 决策卡 */
.dcard{border:1px solid var(--line);border-radius:var(--radius);
  background:var(--panel);margin-bottom:14px;box-shadow:var(--shadow);overflow:hidden}
.dcard.need{border-color:#e3cba6;background:linear-gradient(180deg,#fffdf8,var(--panel))}
.dcard .hd{padding:12px 16px;border-bottom:1px solid var(--line-2);
  display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dcard .hd .t{font-weight:620;font-size:15px}
.dcard .bd{padding:14px 16px}
.opt{
  border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin-bottom:8px;
  cursor:pointer;transition:.12s;background:var(--panel);
}
.opt:hover{border-color:var(--accent);background:var(--accent-soft)}
.opt .lb{font-weight:600;display:flex;align-items:center;gap:8px}
.opt .ds{font-size:13px;color:var(--ink-2);margin-top:3px}
.opt .ch{font-size:12px;color:var(--ink-3);margin-top:5px}
.opt.chosen{border-color:var(--ok);background:var(--ok-soft);cursor:default}
.opt.chosen:hover{border-color:var(--ok);background:var(--ok-soft)}

/* ---------------- 事件卡的结构化三行（v6.9） ---------------- */
/* 「做了什么 / 为什么 / 结果 / 悬置」本来就在事件的 payload 里，只是过去没送到
   页面上，模型只能把这几样揉进 description，写成一段两百多字的流水。
   摆成两列以后既能扫，也不用在 description 里复述一遍。 */
.efields{
  margin:9px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;
  font-size:12.5px;line-height:1.7;
}
.efields dt{color:var(--ink-3);white-space:nowrap;padding-top:1px}
.efields dd{margin:0;color:var(--ink-2)}

/* ---------------- 结构不匹配横幅（v6.8） ---------------- */
/* 挂在 main 顶部、所有视图之上。用 .bad-soft 底 + 左边一道红条，
   跟"普通提示"区分开——这是阻塞状态，不是提醒。 */
.banner{padding:12px 16px;margin-bottom:0;border-bottom:1px solid var(--line);
  line-height:1.7}
.banner.bad{background:var(--bad-soft);color:var(--bad);
  border-left:4px solid var(--bad)}
.banner .cmd{display:inline-block;margin-top:6px;padding:5px 10px;
  border-radius:6px;background:var(--panel);border:1px solid var(--line-2);
  font-family:ui-monospace,Consolas,monospace;font-size:13px;
  color:var(--ink);user-select:all}

/* ---------------- 创建世界：热门题材卡片（v6.8） ---------------- */
/* 卡片本身用 .opt，这里只加"网格 + 热度条 + 来源徽标"三样。
   热度条必须画出来：**光有名次看不出差距**，"都市高武 1947 万"和
   "都市种田 874 万"是不是一个量级，条子长度一眼就分得清。 */
.ggrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media(max-width:760px){.ggrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ggrid .opt{margin-bottom:0;padding:9px 11px}
.gcard .nm{font-weight:620;font-size:13.5px;display:flex;align-items:center;gap:6px}
.gcard .ht{font-size:11.5px;color:var(--ink-3);margin-top:4px;
  display:flex;align-items:center;gap:6px}
.heatbar{height:3px;border-radius:2px;background:var(--line-2);
  margin-top:6px;overflow:hidden}
.heatbar>i{display:block;height:100%;background:var(--accent);border-radius:2px}
.heatbar.base>i{background:var(--ink-3)}      /* 无实时数据：用灰条区分 */
.gdetail{border:1px solid var(--line);border-radius:9px;padding:12px 14px;
  background:var(--panel-2);margin-top:10px}
.gdetail h4{margin:0 0 4px;font-size:13px;color:var(--ink-2);font-weight:620}
.gdetail ul{margin:0 0 9px;padding-left:19px}
.gdetail li{font-size:13px;line-height:1.62;color:var(--ink-2)}
.gdetail li.warn{color:var(--warn)}
.gsrc{font-size:11.5px;color:var(--ink-3);line-height:1.6}
.gtabs{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.gtabs .btn{padding:3px 10px;font-size:12.5px}

/* 推演树：自上而下的思维导图 */
.treesplit{display:flex;gap:14px;align-items:flex-start}
@media(max-width:1100px){.treesplit{flex-direction:column}}
.treehost{flex:1;min-width:0;position:relative}
.treewrap{
  position:relative;overflow:hidden;touch-action:none;cursor:grab;
  border:1px solid var(--line);border-radius:var(--radius);
  background:var(--panel);box-shadow:var(--shadow);
  height:68vh;min-height:320px;
}
.treewrap.dragging{cursor:grabbing}
.treewrap.dragging .tnode{pointer-events:none}
.treecanvas{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.treezoom{
  position:absolute;right:10px;top:10px;z-index:6;display:flex;align-items:center;
  gap:4px;background:var(--panel);border:1px solid var(--line);
  border-radius:9px;padding:3px 6px;box-shadow:var(--shadow);
}
.treezoom .zl{min-width:46px;text-align:center;font-size:12px;color:var(--ink-3)}
.treehint{
  position:absolute;left:10px;bottom:10px;z-index:6;font-size:11.5px;
  color:var(--ink-3);background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:3px 9px;box-shadow:var(--shadow);pointer-events:none;
}
.treecanvas svg{position:absolute;left:0;top:0;pointer-events:none}
.tnode{
  position:absolute;overflow:hidden;display:flex;flex-direction:column;gap:3px;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:8px 10px;cursor:pointer;transition:border-color .12s,box-shadow .12s;
  box-shadow:0 1px 2px rgba(35,33,29,.04);
}
.tnode:hover{border-color:var(--accent)}
.tnode.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tnode .tk{display:flex;align-items:center;gap:5px;font-size:11px;
  color:var(--ink-3);letter-spacing:.2px;flex:0 0 auto}
.tnode .tt{font-weight:620;font-size:13.5px;line-height:1.35;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;flex:0 0 auto}
.tnode .td{font-size:11.5px;line-height:1.45;color:var(--ink-3);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden}
.tnode.k-root{background:var(--accent-soft);border-color:#e3d3c5}
.tnode.k-decision{background:var(--warn-soft);border-color:#e7d5b2}
.tnode.k-option{background:var(--info-soft);border-color:#d2e2ec}
.tnode.offpath{opacity:.42;filter:saturate(.55)}
.tnode.offpath:hover{opacity:.85;filter:none}
.tnode.committed{border-color:var(--ok);background:var(--ok-soft)}
.tnode.committed .tt{color:var(--ok)}
.tnode.pending{box-shadow:0 0 0 3px #f0dcbd}
.treedetail{width:340px;flex:0 0 auto;position:sticky;top:0;scroll-margin-top:12px}
@media(max-width:1100px){
  .treedetail{width:100%;position:static}
  /* 窄屏时详情会落到画布下面：把画布压矮一点，点完不用滚太远 */
  .treewrap{height:54vh;min-height:280px}
}
.treedetail .opt{margin-bottom:6px;padding:9px 11px}

/* ---- 改事件卡面板（v6.8）：自己改 / 让 AI 改 / 查下游衔接 ---- */
.tcwrap{margin-top:12px;border-top:1px solid var(--line);padding-top:11px}
.tcwrap-in{border:1px solid var(--line-2);border-radius:10px;padding:11px 12px;
  background:var(--soft)}
.tctitle{font-weight:620;font-size:13.5px;margin-bottom:9px;display:flex;
  align-items:baseline;gap:6px}
.tcf{display:block;margin-bottom:9px}
.tcf .k{display:block;font-size:12.5px;font-weight:600;margin-bottom:4px;
  color:var(--ink-2)}
.tcf .k i{font-style:normal;font-weight:400;font-size:11.5px;color:var(--ink-3);
  margin-left:6px}
.tcf input,.tcf textarea{
  width:100%;box-sizing:border-box;font-family:inherit;font-size:13px;
  line-height:1.6;color:var(--ink);background:var(--panel);
  border:1px solid var(--line);border-radius:8px;padding:6px 9px;resize:vertical;
}
.tcf input:focus,.tcf textarea:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft)}
.tcrow{display:flex;gap:8px}
.tcf.half{flex:1;min-width:0}
.tcnote{margin-top:9px;font-size:12.5px;line-height:1.7;border-radius:8px;
  padding:8px 10px;background:var(--info-soft);color:var(--ink-2)}
.tcnote.ok{background:var(--ok-soft);color:var(--ink-2)}
.tcnote.warn{background:var(--warn-soft);color:var(--ink-2)}
.tcerr{margin-top:9px;font-size:12.5px;line-height:1.7;border-radius:8px;
  padding:8px 10px;background:var(--bad-soft);color:var(--bad);word-break:break-word}
.tcrun{margin-top:9px;font-size:12.5px;color:var(--ink-3)}
.tccheck{margin-top:11px;border-top:1px dashed var(--line);padding-top:10px}
.tcok{margin-top:8px;font-size:12.5px;line-height:1.7;border-radius:8px;
  padding:9px 11px;background:var(--ok-soft);color:var(--ink-2)}
.tcissue{margin-top:8px;border-radius:9px;padding:9px 11px;font-size:12.5px;
  line-height:1.7;border-left:3px solid var(--warn);background:var(--warn-soft)}
.tcissue.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.tcissue .l1{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;
  margin-bottom:4px}
.tcissue .lv{font-weight:620;font-size:11.5px;padding:1px 6px;border-radius:5px;
  background:rgba(0,0,0,.06)}
.tcissue .asp{font-size:11.5px;color:var(--ink-3);border:1px solid var(--line);
  border-radius:5px;padding:0 5px}
.tcissue .nm{font-weight:600;color:var(--ink)}
.tcissue .rs{color:var(--ink-2)}
.tcissue .qt{margin-top:4px;color:var(--ink-3);font-style:italic}
.tcissue .fx{margin-top:4px;color:var(--ink-2);font-weight:600}

/* 正文 */
.prose{
  font-size:16.5px;line-height:1.95;white-space:pre-wrap;word-break:break-word;
  font-family:Georgia,"Songti SC","Noto Serif CJK SC","Source Han Serif SC",serif;
  letter-spacing:.2px;color:#2a2723;
}
.prose.sm{font-size:15px;line-height:1.85}
#streamOut{border:1px solid var(--line);border-radius:9px;padding:16px 18px;
  background:var(--panel);min-height:120px;max-height:60vh;overflow:auto}

/* 日志 */
.log{font-family:var(--mono);font-size:12.5px;background:#2b2926;color:#ddd8ce;
  border-radius:9px;padding:12px 14px;max-height:220px;overflow:auto;line-height:1.7}
.log .l{white-space:pre-wrap;word-break:break-word}
.log .l.err{color:#f0a9a2}
.log .t{color:#8b857a}

/* 弹层 */
.mask{position:fixed;inset:0;background:rgba(35,33,29,.42);display:none;
  align-items:flex-start;justify-content:center;padding:48px 20px;z-index:50;
  overflow:auto}
.mask.on{display:flex}
.modal{background:var(--panel);border-radius:12px;width:100%;max-width:620px;
  box-shadow:0 18px 60px rgba(35,33,29,.28);overflow:hidden}
.modal.wide{max-width:880px}
.modal .mh{padding:15px 20px;border-bottom:1px solid var(--line);font-weight:640;
  display:flex;align-items:center;gap:10px}
.modal .mb{padding:18px 20px;max-height:64vh;overflow:auto}
.modal .mf{padding:13px 20px;border-top:1px solid var(--line);display:flex;
  gap:9px;justify-content:flex-end;background:var(--panel-2)}

/* toast */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:99;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#2b2926;color:#f0ece4;padding:9px 17px;border-radius:22px;
  font-size:13.5px;box-shadow:0 6px 22px rgba(0,0,0,.2);animation:up .22s ease}
.toast.err{background:var(--bad)}
.toast.ok{background:var(--ok)}
.toast.warn{background:var(--warn)}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 进度 */
.bar{height:5px;background:var(--line-2);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
/* 任务在跑的时候，让条上一直有一道光扫过——哪怕进度值没变，也看得出还活着 */
.bar.run{position:relative}
.bar.run::after{content:'';position:absolute;top:0;bottom:0;width:34%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.62),transparent);
  animation:sweep 1.25s linear infinite}
@keyframes sweep{from{transform:translateX(-115%)}to{transform:translateX(325%)}}
.jobmeta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  font-family:var(--mono);font-size:12.5px;color:var(--ink-3);margin-bottom:7px}
.busy{display:inline-block;width:13px;height:13px;border:2px solid var(--line);
  border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* KV 行 */
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.kv .k{color:var(--ink-3);white-space:nowrap}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">AI 小说创作系统 <span class="v">v6.0 世界模拟</span></div>
    <div class="spacer"></div>
    <div class="novpick">
      <span class="dim small">当前世界</span>
      <select id="novelSel" onchange="switchNovel(this.value)"></select>
      <button class="btn sm" onclick="openNewNovel()">＋ 新世界</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab on" data-v="world" onclick="go('world')">世界</button>
    <button class="tab" data-v="tree" onclick="go('tree')">推演
      <span class="dot" id="tabDotTree"></span></button>
    <button class="tab" data-v="chapter" onclick="go('chapter')">章节
      <span class="dot" id="tabDotChapter"></span></button>
    <button class="tab" data-v="manage" onclick="go('manage')">设置</button>
    <button class="tab" data-v="skills" onclick="go('skills')">技能库</button>
  </div>

  <main>
    <!-- 结构不匹配时的横幅挂在所有视图之上：这是"现在什么都做不了"的状态，
         不能塞进某个视图里（用户可能正好停在别的页签）。 -->
    <div id="appBanner" style="display:none"></div>
    <div class="wrap">
      <section class="view on" id="v-world"></section>
      <section class="view" id="v-tree"></section>
      <section class="view" id="v-chapter"></section>
      <section class="view" id="v-manage"></section>
      <section class="view" id="v-skills"></section>
    </div>
  </main>
</div>

<div class="mask" id="mask">
  <div class="modal" id="modal">
    <div class="mh"><span id="modalTitle">标题</span></div>
    <div class="mb" id="modalBody"></div>
    <div class="mf" id="modalFoot"></div>
  </div>
</div>
<div id="toast"></div>

<script>
/* ============================================================
   基础
   ============================================================ */
const S = {
  view: 'world',
  novels: [], novelId: 0, meta: null,
  schema: null,        // 开机查 /api/schema：库结构是否跟得上代码
  novel: null, clock: null, stats: null,
  state: [], entities: [], characters: [], threads: [], goals: [],
  decisions: [], openDecisions: [], chapters: [], voice: [], seeds: [], worldGoals: [],
  compGoals: [], completion: null, jobs: {}, searchKw: '',
  curChapter: 0,
  // 章节页：待成章事件的分批计划（每章几个）与勾选状态
  candidates: [], candPlan: null, candSel: null, chapterView: null,
  // 创建世界第 2 步：初始阵容草案（未落库前都只在前端）
  castDraft: null, castMeta: null,
  // 创建世界第 1 步（v6.8）：热门题材 + 世界草案
  //   这些字段存在的唯一理由是：**弹层每次重绘都不能丢用户已经填的东西**。
  //   点页签、选题材、"联网刷新"都会重绘 modalBody，而 innerHTML 一换，
  //   表单里用户敲的字就全没了。所以重绘前先 nwSnapshot() 存进 S.nwForm，
  //   重绘时从 S.nwForm 读回来——这是本项目"数据没错、是展示层自己丢状态"
  //   那条铁律的同一类坑，别在新建世界这条最长的表单上再踩一次。
  nwForm: null, nwHint: '', nwDraft: null,
  nwGenre: { list: [], source: null, audiences: [], audience: '',
             sel: null, loading: false, refreshing: false, err: '' },
  // v6.7 正史账本层：账本抽屉 / 世界规则 / 待裁决候选 / 知识矩阵 / 章节冲突 / 分支状态
  canon: null, canonFacts: [], canonRules: [], canonCandidates: [],
  canonKnowledge: [], conflicts: [], branch: null,
  canonOpen: false,
};

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;');
const nl2br = s => esc(s).replace(/\n/g, '<br>');

function toast(msg, kind) {
  const d = document.createElement('div');
  d.className = 'toast' + (kind ? ' ' + kind : '');
  d.textContent = msg;
  $('#toast').appendChild(d);
  setTimeout(() => { d.style.opacity = '0'; d.style.transition = 'opacity .3s';
    setTimeout(() => d.remove(), 320); }, kind === 'err' ? 5200 : 2400);
}

async function api(path, opts) {
  opts = opts || {};
  const init = { method: opts.method || 'GET', headers: {} };
  if (opts.body !== undefined) {
    init.headers['Content-Type'] = 'application/json';
    init.body = JSON.stringify(opts.body);
  }
  const res = await fetch(path, init);
  let data = {};
  try { data = await res.json(); } catch (e) { data = {}; }
  if (!res.ok) {
    /* 带上 status 和整个响应体。
       只抛 data.error 的话，调用方只剩一句人能读的话，分不清「你填错了」(400)
       和「这张卡被别人改过了」(409)——而这两件事该做的事完全不同：
       前者把提示挂在输入框上，后者要重新拉一遍数据。挂成属性，老的
       catch(e){ e.message } 写法不受影响。 */
    const err = new Error(data.error || ('请求失败 ' + res.status));
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}

function spin(on, el) {
  if (!el) return;
  if (on) { el.dataset._t = el.innerHTML;
    el.innerHTML = '<span class="busy"></span> ' + (el.dataset.busy || '处理中…');
    el.disabled = true; }
  else { if (el.dataset._t !== undefined) el.innerHTML = el.dataset._t;
    el.disabled = false; }
}

/* ============================================================
   弹层
   ============================================================ */
function openModal(title, bodyHtml, footHtml, wide) {
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = bodyHtml;
  $('#modalFoot').innerHTML = footHtml || '<button class="btn" onclick="closeModal()">关闭</button>';
  $('#modal').className = 'modal' + (wide ? ' wide' : '');
  $('#mask').classList.add('on');
}
function closeModal() { $('#mask').classList.remove('on'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* 点遮罩空白处关闭弹层。
   注意不要用 onclick：onclick 是 mousedown+mouseup 的合成事件，
   用户在输入框里拖选文字（复制服务商名/模型名）时手一滑松在遮罩上，
   浏览器就判定为一次 click，弹层会莫名关闭（"鼠标一拖动就关了"）。
   所以这里记录按下时的落点，只有按下和松开都落在遮罩本身才关闭。 */
(function bindMaskClose() {
  const mask = $('#mask');
  let downOnMask = false;
  mask.addEventListener('mousedown', e => { downOnMask = (e.target === mask); });
  mask.addEventListener('mouseup', e => {
    if (downOnMask && e.target === mask) closeModal();
    downOnMask = false;
  });
  // 指针拖到遮罩外再松开：重置状态，避免残留标记导致误关
  document.addEventListener('mouseup', () => { downOnMask = false; });
})();

/* ============================================================
   导航
   ============================================================ */
function go(v) {
  S.view = v;
  try { localStorage.setItem('nw_view', v); } catch (e) {}
  $$('.tab').forEach(t => t.classList.toggle('on', t.dataset.v === v));
  $$('.view').forEach(s => s.classList.toggle('on', s.id === 'v-' + v));
  // 先用手上的数据渲染一次（切换要立刻有反应，不能白屏等网络）
  render();
  // 再拉新数据；**数据回来后必须重渲染**。
  // 踩过的坑：这里原来只调 refreshView(v) 就完了，切到「首次打开」的页签时，
  // render() 用的是空数据 → 页面一片空白，而数据回来后又没人重画，
  // 只能靠 F5 重新走 boot()（boot 里是 await refreshView; render 的正确顺序）。
  // 与 switchNovel() 保持同一套写法。
  Promise.resolve(refreshView(v)).then(() => {
    if (S.view === v) render();      // 期间用户又切走了就别抢画
  }).catch(() => { if (S.view === v) render(); });
}

const TITLES = { world: '世界', tree: '推演', chapter: '章节', manage: '设置',
                 skills: '技能库' };

function render() {
  // 技能库是全局页：**没有世界时也要能打开**。它管的是模型怎么被调用，
  // 跟当前选了哪本书无关，不能因为 novelId=0 就被 renderNoNovel 挡掉。
  if (S.view === 'skills') renderSkills();
  else if (!S.novelId) renderNoNovel();
  else if (S.view === 'world') renderWorld();
  else if (S.view === 'tree') renderTree();
  else if (S.view === 'chapter') renderChapter();
  else renderManage();
  $('#tabDotTree').classList.toggle('show',
    !!((S.tree || {}).pending_decision));
}

function renderNoNovel() {
  ['world', 'tree', 'chapter', 'manage'].forEach(v => {
    $('#v-' + v).innerHTML = `<div class="card"><div class="empty">
      ${v === 'manage' ? '' : '还没有世界。'}
      <p><button class="btn pri" onclick="openNewNovel()">创建第一个世界</button></p>
    </div></div>`;
  });
  if (S.view === 'manage') renderManage(true);
}

/* ============================================================
   数据加载
   ============================================================ */
async function boot() {
  // 开机先查库结构。老库没迁移时代码一查就是 "no such table"，
  // 表现为整屏 traceback；与其等某个接口炸，不如一开始就横幅说清楚该跑什么命令。
  try { S.schema = await api('/api/schema'); } catch (e) { S.schema = null; }
  if (S.schema && S.schema.needs_migration) showMigrationBanner(S.schema);
  try {
    S.meta = await api('/api/meta');
    S.novels = S.meta.novels || [];
    const saved = localStorage.getItem('nw_novel');
    const pick = S.novels.find(n => String(n.id) === saved) || S.novels[0];
    if (pick) S.novelId = pick.id;
    fillNovelSelect();
    // 恢复上次停留的页签，否则一刷新就跳回「世界」，
    // 用户会以为刚保存的配置"不见了"（其实只是换了页面）
    const VIEWS = ['world', 'tree', 'chapter', 'manage', 'skills'];
    let v = '';
    try { v = localStorage.getItem('nw_view') || ''; } catch (e) {}
    if (v === 'decide') v = 'tree';        // 旧版页签名，平滑过渡
    // 正史账本抽屉的展开状态也要恢复：视图状态一律持久化，
    // 不能"每次刷新都弹回去"（本项目同类坑已踩四遍）
    try { S.canonOpen = localStorage.getItem('nw_canon_open') === '1'; } catch (e) {}
    if (VIEWS.includes(v)) {
      S.view = v;
      $$('.tab').forEach(t => t.classList.toggle('on', t.dataset.v === v));
      $$('.view').forEach(s => s.classList.toggle('on', s.id === 'v-' + v));
    }
    await refreshView(S.view);
    render();
  } catch (e) { toast(e.message, 'err'); }
}

/* 库结构与代码不匹配时的横幅。
   为什么不是弹窗：弹窗一关就忘，而这是"现在什么都做不了"的状态——
   必须一直挂在那儿，直到用户真的去迁移并重启服务。 */
function showMigrationBanner(s) {
  const host = document.getElementById('appBanner');
  if (!host) return;
  const miss = (s.missing_tables || []).slice(0, 4).join('、');
  const more = (s.missing_tables || []).length > 4
    ? ' 等 %d 张'.replace('%d', (s.missing_tables || []).length) : '';
  host.innerHTML = `
    <div class="banner bad">
      <b>数据库还没迁移，很多功能现在打不开。</b>
      <div class="small" style="margin-top:6px;line-height:1.75">
        当前结构版本 <b>${s.current_version || 0}</b>，代码需要 <b>${s.want_version}</b>。
        缺的表：${esc(miss)}${more}。<br>
        请在项目根目录执行下面这条命令（会自动备份，可以重复执行），<b>然后重启本服务</b>：
        <code class="cmd">${esc(s.command || 'python src_v6/core/migrate.py')}</code>
      </div>
    </div>`;
  host.style.display = 'block';
}

function switchNovel(v) {
  S.novelId = parseInt(v, 10) || 0;
  localStorage.setItem('nw_novel', String(S.novelId));
  resetNovelCache();
  refreshView(S.view).then(render);
}

async function refreshView(v) {
  // 技能库不依赖当前世界，**没有世界也要放行**（否则空库时这页永远空白）
  if (!S.novelId && v !== 'skills') return;
  const nid = S.novelId;
  try {
    if (v === 'world') {
      // 换作品时视角要重置：上一个作品的角色 id 在新作品里可能是别人
      if (S.lastMapNovel !== nid) { S.mapViewer = 0; S.lastMapNovel = nid; }
      const [novel, state, ents, chars, thr, clock, goals, decs, rels] = await Promise.all([
        api('/api/novel?novel_id=' + nid), api('/api/state?novel_id=' + nid),
        api('/api/entities?novel_id=' + nid),
        api('/api/characters?novel_id=' + nid),
        api('/api/threads?novel_id=' + nid + '&chapter=' +
            ((S.novel && S.novel.current_chapter) || 0)),
        api('/api/clock?novel_id=' + nid),
        api('/api/goals?novel_id=' + nid + '&status=active'),
        api('/api/decisions?novel_id=' + nid + '&resolved=0'),
        api('/api/relations?novel_id=' + nid),
      ]);
      S.novel = novel.novel; S.setting = novel.setting || [];
      S.attributes = novel.attributes || {};
      S.state = state.state || []; S.stateHistory = state.history || [];
      S.entities = ents.entities || [];
      S.characters = chars.characters || [];
      S.threads = thr.threads || []; S.urgent = thr.urgent || [];
      S.clock = clock.clock; S.timeline = clock.timeline || [];
      S.goals = goals.goals || [];
      S.openDecisions = (decs.decisions || []).filter(d => !d.resolved);
      S.relations = rels.relations || [];
      // v6.7 正史账本：单独拉、单独失败。**不能并进上面那串 Promise.all**——
      // 老库没跑迁移时这几个接口会 404/500，并进去会把整个世界页一起打空，
      // 表现为"升级后世界页白屏"，看起来像代码坏了，其实只是没迁移。
      try {
        const [sum, fac, rul, cand] = await Promise.all([
          api('/api/canon/summary?novel_id=' + nid),
          api('/api/canon/facts?novel_id=' + nid),
          api('/api/canon/rules?novel_id=' + nid),
          api('/api/canon/candidates?novel_id=' + nid),
        ]);
        S.canon = sum.summary || null;
        S.canonFacts = fac.facts || [];
        S.canonRules = rul.rules || [];
        S.canonCandidates = cand.candidates || [];
      } catch (e) {
        S.canon = null; S.canonFacts = []; S.canonRules = []; S.canonCandidates = [];
      }
      // 地图单独拉：它带视角参数，且失败不该拖垮整个世界页
      try { await loadMap(); } catch (e) { S.map = null; }
    } else if (v === 'tree') {
      S.tree = await api('/api/tree?novel_id=' + nid);
      S.novel = (await api('/api/novel?novel_id=' + nid)).novel;
      const ch = await api('/api/chapters?novel_id=' + nid);
      S.chapters = ch.chapters || []; S.curChapter = ch.current_chapter || 0;
      // 分支状态侧栏（只读）：base tick / overlay / 校验报告。
      // 同样单独失败：branch_status 依赖新列，老库上会报错。
      try {
        S.branch = await api('/api/tree/branch', { method: 'POST',
          body: { novel_id: nid } });
      } catch (e) { S.branch = null; }
    } else if (v === 'chapter') {
      const [chs, nv, thr] = await Promise.all([
        api('/api/chapters?novel_id=' + nid),
        api('/api/novel?novel_id=' + nid),
        api('/api/threads?novel_id=' + nid),
      ]);
      S.chapters = chs.chapters || []; S.curChapter = chs.current_chapter || 0;
      S.novel = nv.novel; S.stats = nv.stats;
      S.threads = thr.threads || [];
      const cand = await api('/api/chapter/candidates?novel_id=' + nid);
      S.candidates = cand.events || []; S.characters = cand.characters || [];
      S.candPlan = { per_chapter: cand.suggested_limit || 4,
                     planned_chapters: cand.planned_chapters || 0,
                     target_words_per_chapter: cand.target_words_per_chapter || 3000 };
      // 每次刷新都重算勾选：上一轮选中的事件可能已经被别的章用掉了
      S.candSel = null;
      // 未裁决的正文-正史冲突（顶部红徽标 + 冲突卡片）
      try {
        S.conflicts = (await api('/api/chapter/conflicts?novel_id=' + nid))
          .conflicts || [];
      } catch (e) { S.conflicts = []; }
    } else if (v === 'manage') {
      await loadManage();
    } else if (v === 'skills') {
      await loadSkills();
    }
  } catch (e) { toast(e.message, 'err'); }
}

async function loadManage() {
  const nid = S.novelId;
  const [prov, slots, voice, seeds, cg, arch, nvs] = await Promise.all([
    api('/api/providers'), api('/api/slots?novel_id=' + nid),
    api('/api/voice?novel_id=' + nid + '&all=1'),
    api('/api/seeds?novel_id=' + nid + '&all=1'),
    api('/api/completion?novel_id=' + nid),
    api('/api/novels/archived'), api('/api/novels'),
  ]);
  S.providers = prov.providers || []; S.secretsPath = prov.secrets_path;
  S.slots = slots.slots || [];
  S.voice = voice.voice || []; S.seeds = seeds.seeds || [];
  S.compGoals = cg.goals || []; S.completionMode = cg.completion_mode;
  S.archived = arch.novels || [];
  S.novels = nvs.novels || []; fillNovelSelect();
  // 「世界管理」卡片要显示当前世界的规模，单独拉一次统计
  try {
    const nv = await api('/api/novel?novel_id=' + nid);
    S.novel = nv.novel; S.stats = nv.stats; S.clock = nv.clock;
  } catch (e) {}
  S.health = await api('/api/health');
}
</script>
<script src="/static/app.js"></script>
</body>
</html>
